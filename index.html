<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 15px;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            display: none; /* Скрыто, пока не выберут тип */
        }
    </style>
</head>
<body>

    <h2>Выберите тип</h2>
    <button class="btn" onclick="selectType('вопрос')">❓ Вопрос</button>
    <button class="btn" onclick="selectType('сообщение')">💬 Сообщение</button>

    <textarea id="textInput" placeholder="Введите ваше сообщение..."></textarea>

    <script>
        // Объявляем переменную только ОДИН раз
        const tg = window.Telegram.WebApp;
        let currentType = '';

        tg.expand();

        function selectType(type) {
            currentType = type;
            document.getElementById('textInput').style.display = 'block';
            tg.MainButton.text = "ОТПРАВИТЬ " + type.toUpperCase();
            tg.MainButton.show();
        }

        tg.onEvent('mainButtonClicked', function() {
            const messageText = document.getElementById('textInput').value;
            
            if (!messageText.trim()) {
                tg.showAlert("Введите текст!");
                return;
            }

            const data = {
                type: currentType,
                message: messageText
            };

            // Отправляем данные боту
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
